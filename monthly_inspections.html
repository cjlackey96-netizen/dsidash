<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspections by month</title>
<style>
  /* ---- COLOURS: change these to restyle the panel ---- */
  :root {
    --bg:        #ffffff;   /* panel background        */
    --ink:       #1a1a1a;   /* main text               */
    --muted:     #6b6b6b;   /* axis labels, footnote   */
    --grid:      #e6e6e6;   /* gridlines               */
    --y2024:     #8aa8c8;   /* 2024 line               */
    --y2025:     #e0a33e;   /* 2025 line               */
    --y2026:     #c0392b;   /* 2026 line               */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .chip input { width: 15px; height: 15px; cursor: pointer; margin: 0; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; }
  svg { width: 100%; height: auto; display: block; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 11px; }
  .line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--bg); stroke-width: 2; }
  .lbl { font-size: 10px; font-weight: 600; paint-order: stroke;
         stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
  .tip {
    position: fixed; pointer-events: none; opacity: 0;
    background: var(--ink); color: #fff; font-size: 12px;
    padding: 5px 8px; border-radius: 4px; white-space: nowrap;
    transition: opacity .12s;
  }
  .foot { font-size: 11px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>

<h1>Defensible space inspections by month</h1>
<div class="sub">Labels show the running total for the year to that month</div>

<div class="legend" id="legend"></div>
<div id="chart"></div>
<div class="foot" id="foot"></div>
<div class="tip" id="tip"></div>

<script>
// ---- DATA (regenerated by the pipeline) ----
const DATA = {"2024": [0, 0, 0, 0, 1, 112, 501, 599, 712, 628, 308, 33], "2025": [0, 0, 0, 73, 601, 552, 753, 904, 587, 735, 143, 1], "2026": [0, 0, 3, 342, 437, 406, 931, 712, 257, 0, 0, 0]};
const LAST_MONTH = 8;
const GENERATED = "2026-09-29";
// -------------------------------------------

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun",
                "Jul","Aug","Sep","Oct","Nov","Dec"];
const YEARS = Object.keys(DATA);
const NEWEST = YEARS[YEARS.length - 1];
const COLOURS = {};
YEARS.forEach(y => COLOURS[y] = getComputedStyle(document.documentElement)
                                 .getPropertyValue("--y" + y).trim() || "#888");
const hidden = new Set();

const W = 760, H = 360, M = {t: 20, r: 18, b: 34, l: 46};
const iw = W - M.l - M.r, ih = H - M.t - M.b;

const stopFor = yr => (yr === NEWEST) ? LAST_MONTH : 12;

function maxY() {
  let m = 0;
  YEARS.forEach(y => {
    if (hidden.has(y)) return;
    DATA[y].slice(0, stopFor(y)).forEach(v => { if (v > m) m = v; });
  });
  return Math.max(10, Math.ceil(m / 50) * 50);
}
const x = i => M.l + (i / 11) * iw;
const y = (v, mx) => M.t + ih - (v / mx) * ih;

function draw() {
  const mx = maxY();
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Inspections by month">`;

  for (let i = 0; i <= 4; i++) {
    const v = (mx / 4) * i, yy = y(v, mx);
    s += `<line class="gridline" x1="${M.l}" y1="${yy}" x2="${W - M.r}" y2="${yy}"/>`;
    s += `<text class="axis" x="${M.l - 8}" y="${yy + 4}" text-anchor="end">${v}</text>`;
  }
  MONTHS.forEach((m, i) => {
    s += `<text class="axis" x="${x(i)}" y="${H - 12}" text-anchor="middle">${m}</text>`;
  });

  YEARS.forEach(yr => {
    if (hidden.has(yr)) return;
    const stop = stopFor(yr);
    const vals = DATA[yr].slice(0, stop);
    const pts = vals.map((v, i) => `${x(i)},${y(v, mx)}`).join(" ");
    s += `<polyline class="line" points="${pts}" stroke="${COLOURS[yr]}"/>`;

    let run = 0;
    vals.forEach((v, i) => {
      run += v;
      s += `<circle class="dot" cx="${x(i)}" cy="${y(v, mx)}" r="4"
             fill="${COLOURS[yr]}" data-y="${yr}" data-m="${i}"
             data-v="${v}" data-c="${run}"/>`;
      s += `<text class="lbl" x="${x(i)}" y="${y(v, mx) - 9}"
             text-anchor="middle" fill="${COLOURS[yr]}">${run}</text>`;
    });
  });

  s += `</svg>`;
  document.getElementById("chart").innerHTML = s;
  wireTips();
}

function wireTips() {
  const tip = document.getElementById("tip");
  document.querySelectorAll(".dot").forEach(d => {
    d.addEventListener("mouseenter", () => {
      tip.textContent = `${MONTHS[d.dataset.m]} ${d.dataset.y}: `
                      + `${d.dataset.v} this month, ${d.dataset.c} year to date`;
      tip.style.opacity = 1;
    });
    d.addEventListener("mousemove", e => {
      tip.style.left = (e.clientX + 12) + "px";
      tip.style.top  = (e.clientY - 28) + "px";
    });
    d.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
}

function legend() {
  const el = document.getElementById("legend");
  el.innerHTML = YEARS.map(yr =>
    `<label class="chip">
       <input type="checkbox" checked data-y="${yr}">
       <span class="swatch" style="background:${COLOURS[yr]}"></span>${yr}
     </label>`).join("");
  el.querySelectorAll("input").forEach(cb => {
    cb.addEventListener("change", () => {
      const yr = cb.dataset.y;
      if (cb.checked) hidden.delete(yr);
      else if (hidden.size < YEARS.length - 1) hidden.add(yr);
      else cb.checked = true;          // keep at least one year visible
      draw();
    });
  });
}

document.getElementById("foot").textContent =
  `${NEWEST} data through ${MONTHS[LAST_MONTH-1]} (partial year). Updated ${GENERATED}.`;

legend();
draw();
window.addEventListener("resize", draw);
</script>
</body>
</html>
